<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>KOLOO-HUB · DB Console</title>
<style>
:root{
  --bg:#0a0e14; --panel:#101822; --panel2:#0c121a; --line:#1c2733; --line2:#243445;
  --ink:#dbe6f0; --ink2:#8aa0b4; --ink3:#5b7088; --cyan:#22d3ee; --rose:#fb7185; --amber:#fbbf24;
  --mono:ui-monospace,"SF Mono","JetBrains Mono","Cascadia Code",Consolas,Menlo,monospace;
  --sans:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",Roboto,sans-serif;
}
*{box-sizing:border-box} body{margin:0;font-family:var(--sans);background:var(--bg);color:var(--ink);-webkit-font-smoothing:antialiased}
header{border-bottom:1px solid var(--line);padding:12px 18px;display:flex;align-items:center;gap:14px}
.logo{font-family:var(--mono);font-weight:700;color:var(--cyan);letter-spacing:1px}
.sub{font-family:var(--mono);font-size:11px;letter-spacing:3px;text-transform:uppercase;color:var(--ink3)}
a.back{margin-left:auto;font-family:var(--mono);font-size:11px;color:var(--ink2);text-decoration:none;border:1px solid var(--line2);padding:6px 10px;border-radius:6px}
a.back:hover{color:var(--cyan);border-color:var(--cyan)}
.wrap{display:grid;grid-template-columns:280px 1fr;gap:14px;padding:16px 18px}
@media(max-width:820px){.wrap{grid-template-columns:1fr}}
.tables{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px;max-height:80vh;overflow:auto}
.tables h3{font-family:var(--mono);font-size:10px;letter-spacing:2px;text-transform:uppercase;color:var(--ink3);margin:4px 6px 10px}
.tbl{border:1px solid var(--line);border-radius:7px;margin-bottom:8px;overflow:hidden}
.tbl .hd{display:flex;align-items:center;gap:8px;padding:8px 10px;background:var(--panel2);cursor:pointer;font-family:var(--mono);font-size:12px}
.tbl .hd:hover{color:var(--cyan)}
.tbl .hd .rows{margin-left:auto;color:var(--ink3);font-size:11px}
.tbl .ddl{display:none;padding:8px 10px;font-family:var(--mono);font-size:10px;color:var(--ink2);white-space:pre-wrap;word-break:break-all;border-top:1px solid var(--line)}
.tbl.open .ddl{display:block}
.console{display:flex;flex-direction:column;gap:10px}
textarea{width:100%;min-height:120px;background:var(--panel2);border:1px solid var(--line2);border-radius:8px;color:var(--ink);font-family:var(--mono);font-size:13px;padding:12px;resize:vertical;outline:none;line-height:1.5}
textarea:focus{border-color:var(--cyan)}
.bar{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
button{exe:none;font-family:var(--mono);font-size:12px;letter-spacing:1px;background:var(--cyan);color:#06121a;border:0;border-radius:7px;padding:9px 16px;cursor:pointer;font-weight:600}
button.ghost{background:transparent;color:var(--ink2);border:1px solid var(--line2)}
button:hover{filter:brightness(1.1)}
select,input.tok{font-family:var(--mono);font-size:12px;background:var(--panel);color:var(--ink);border:1px solid var(--line2);border-radius:7px;padding:8px 10px;outline:none}
.meta{font-family:var(--mono);font-size:11px;color:var(--ink3)}
.meta b{color:var(--ink2)}
.result{background:var(--panel);border:1px solid var(--line);border-radius:10px;overflow:auto;max-height:60vh}
table{border-collapse:collapse;width:100%;font-family:var(--mono);font-size:12px}
th,td{border-bottom:1px solid var(--line);padding:6px 10px;text-align:left;white-space:nowrap}
th{position:sticky;top:0;background:var(--panel2);color:var(--cyan);font-weight:600}
td{color:var(--ink2)}
tr:hover td{background:var(--panel2)}
.err{color:var(--rose);font-family:var(--mono);font-size:12px;padding:10px}
.kbd{font-family:var(--mono);font-size:11px;color:var(--ink3)}
</style>
</head>
<body>
<header>
  <span class="logo">◢ KOLOO·HUB</span>
  <span class="sub">DB Console</span>
  <a class="back" href="/">◂ 返回看板</a>
</header>
<div class="wrap">
  <aside class="tables">
    <h3>表结构 / SCHEMATA</h3>
    <div id="tableList"><div class="meta">加载中…</div></div>
  </aside>
  <section class="console">
    <div class="bar">
      <input class="tok" id="token" placeholder="admin token" style="flex:1;min-width:180px" />
      <select id="limit">
        <option value="100">limit 100</option>
        <option value="200" selected>limit 200</option>
        <option value="500">limit 500</option>
        <option value="1000">limit 1000</option>
      </select>
      <button id="run">▷ 执行 (只读)</button>
      <button class="ghost" id="csv">⭳ CSV</button>
    </div>
    <textarea id="sql" spellcheck="false">SELECT * FROM daily ORDER BY day DESC LIMIT 50;</textarea>
    <div class="meta" id="meta">只读模式：仅允许 SELECT / WITH / EXPLAIN 单条语句。</div>
    <div class="result" id="result"><div class="meta" style="padding:14px">结果将显示在此。</div></div>
  </section>
</div>
<script>
const $ = s => document.querySelector(s);
const token = new URLSearchParams(location.search).get('token') || localStorage.getItem('kh_admin') || '';
if(token) localStorage.setItem('kh_admin',token);
$('#token').value = token;

function authHeader(){ const t=$('#token').value.trim(); return t?{'X-Admin-Token':t}:{}; }

async function loadTables(){
  try{
    const r = await fetch('/api/v1/admin/tables',{headers:authHeader()});
    if(!r.ok){ $('#tableList').innerHTML='<div class="err">'+await r.text()+'</div>'; return; }
    const j = await r.json();
    $('#tableList').innerHTML = (j.tables||[]).map(t=>`
      <div class="tbl">
        <div class="hd" onclick="this.parentElement.classList.toggle('open')">
          <span>${t.name}</span><span class="rows">${t.rows} 行</span>
        </div>
        <div class="ddl">${escapeHtml(t.sql||'')}</div>
      </div>`).join('') || '<div class="meta">无表</div>';
  }catch(e){ $('#tableList').innerHTML='<div class="err">'+e.message+'</div>'; }
}
function escapeHtml(s){return (s||'').replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));}

async function runQuery(csv){
  const sql=$('#sql').value.trim(); const limit=$('#limit').value;
  if(!sql){return;}
  $('#meta').textContent='执行中…';
  let url='/api/v1/admin/query?limit='+limit;
  if(csv) url+='&format=csv';
  const r= await fetch(url,{method:'POST',headers:Object.assign({'Content-Type':'application/json'},authHeader()),body:JSON.stringify({sql,limit:+limit})});
  if(!r.ok){
    let msg=''; try{const j=await r.json();msg=j.error||'';}catch(e){msg=await r.text();}
    $('#result').innerHTML='<div class="err">'+(msg||('HTTP '+r.status))+'</div>'; $('#meta').textContent='失败'; return;
  }
  if(csv){ // 下载
    const blob=await r.blob(); const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download='export.csv'; a.click();
    $('#meta').textContent='已导出 CSV'; return;
  }
  const j= await r.json();
  $('#meta').innerHTML=`返回 <b>${j.row_count}</b> 行 · 耗时 <b>${j.elapsed_ms}ms</b>${j.truncated?' · <span style="color:var(--amber)">已截断(超 limit)</span>':''}`;
  if(!j.columns||j.columns.length===0){ $('#result').innerHTML='<div class="meta" style="padding:14px">语句执行成功，无结果集。</div>'; return; }
  const head='<tr>'+j.columns.map(c=>`<th>${c}</th>`).join('')+'</tr>';
  const body=j.rows.map(row=>'<tr>'+row.map(c=>`<td>${cell(c)}</td>`).join('')+'</tr>').join('');
  $('#result').innerHTML=`<table>${head}${body}</table>`;
}
function cell(v){
  if(v===null||v===undefined) return '<span style="color:var(--ink3)">NULL</span>';
  if(typeof v==='object') v=JSON.stringify(v);
  return escapeHtml(String(v));
}
$('#run').addEventListener('click',()=>runQuery(false));
$('#csv').addEventListener('click',()=>runQuery(true));
$('#token').addEventListener('input',()=>localStorage.setItem('kh_admin',$('#token').value.trim()));
$('#sql').addEventListener('keydown',e=>{ if((e.ctrlKey||e.metaKey)&&e.key==='Enter') runQuery(false); });
loadTables();
</script>
</body>
</html>
